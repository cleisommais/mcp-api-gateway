name: prreview-vps

x-java: &java
  image: prreview-vps:current
  build:
    context: .
    dockerfile: deploy/oci/Dockerfile
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  restart: unless-stopped
  environment: &java-env
    JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:ActiveProcessorCount=2
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

x-github: &github
  GITHUB_AUTH_MODE: app
  GITHUB_APP_ID: ${GITHUB_APP_ID:?GitHub App ID required}
  GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:?GitHub installation required}
  GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app-key

x-mcp: &mcp
  MCP_GATEWAY_URL: http://mcp-gateway:8080
  MCP_GATEWAY_TOKEN_FILE: /run/secrets/mcp-gateway-token

x-database: &database
  DATABASE_URL: jdbc:postgresql://postgres:5432/mcp_review
  DATABASE_SCHEMA: review
  DATABASE_PASSWORD_FILE: /run/secrets/database-password

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: mcp_review
      POSTGRES_USER: mcp_review
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
    secrets: [database-password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mcp_review -d mcp_review]
      interval: 5s
      timeout: 3s
      retries: 30

  mcp-gateway:
    <<: *java
    environment:
      <<: [*java-env, *github, *mcp]
      GATEWAY_CONFIG: /config/gateway.json
      GITLAB_READ_TOKEN_FILE: /run/secrets/gitlab-read-token
      BITBUCKET_READ_TOKEN_FILE: /run/secrets/bitbucket-read-token
      BITBUCKET_EMAIL: ${BITBUCKET_EMAIL:-}
      PLATFORM_MAX_CONCURRENT: '1'
    secrets: [mcp-gateway-token, github-app-key, gitlab-read-token, bitbucket-read-token]
    volumes: [./config/gateway.json:/config/gateway.json:ro]
    entrypoint: [java, -Dorg.slf4j.simpleLogger.defaultLogLevel=off, -cp, '/app/mcp-api-gateway.jar:/app/lib/*', com.prreview.mcpgateway.McpGatewayApplication]
    healthcheck:
      test: [CMD, java, -cp, '/app/mcp-api-gateway.jar:/app/lib/*', com.prreview.mcpgateway.McpGatewayApplication, --health]
      interval: 10s
      timeout: 5s
      retries: 30

  api-gateway:
    <<: *java
    environment:
      <<: [*java-env, *database, *mcp]
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:?GitHub installation required}
      REPOSITORIES_CONFIG: /config/repositories.json
      API_TOKEN_FILE: /run/secrets/api-token
      GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github-webhook-secret
      GITLAB_WEBHOOK_SECRET_FILE: /run/secrets/gitlab-webhook-secret
      BITBUCKET_WEBHOOK_SECRET_FILE: /run/secrets/bitbucket-webhook-secret
      BITBUCKET_READ_TOKEN_FILE: /run/secrets/bitbucket-read-token
      BITBUCKET_EMAIL: ${BITBUCKET_EMAIL:-}
    secrets: [database-password, mcp-gateway-token, api-token, github-webhook-secret, gitlab-webhook-secret, bitbucket-webhook-secret, bitbucket-read-token]
    volumes: [./config/repositories.json:/config/repositories.json:ro]
    entrypoint: [java, -cp, '/app/mcp-api-gateway.jar:/app/lib/*', com.prreview.apigateway.ApiGatewayApplication]
    depends_on:
      postgres: {condition: service_healthy}
      mcp-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, java, -cp, '/app/mcp-api-gateway.jar:/app/lib/*', com.prreview.apigateway.ApiGatewayApplication, --health]
      interval: 10s
      timeout: 5s
      retries: 30

  agent-worker:
    <<: *java
    environment:
      <<: [*java-env, *database, *github, *mcp]
      MODEL_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_REASONING: medium
      OPENAI_API_KEY_FILE: /run/secrets/openai-api-key
      REVIEW_MODE: single
      REVIEW_PROMPT_PROFILE: original
      OLLAMA_CONTEXT_LENGTH: '8192'
      REVIEW_OUTPUT_TOKENS: '4096'
      REVIEW_MAX_MODEL_CALLS: '8'
      REVIEW_TIMEOUT_SECONDS: '240'
      REVIEW_TOTAL_SECONDS: '600'
      EXTERNAL_INFERENCE_ENABLED: 'true'
      EXTERNAL_ALLOWED_REPOSITORIES: github:cleisommais/pr-test-repo,github:cleisommais/pr-test-repo-private,gitlab:cleisommais/pr-test-repo,bitbucket:cleisommais/pr-test-repo
      EXTERNAL_MAX_COST_USD: ${EXTERNAL_MAX_COST_USD:-0.20}
      EXTERNAL_BUDGET_JOURNAL: /reports/oci-gpt-budget.json
      WORKER_MAX_JOBS: '1'
      WORKER_MAX_JOBS_PER_REPOSITORY: '1'
      WORKER_LEASE_SECONDS: '90'
      INFERENCE_MAX_CONCURRENT: '1'
      GITLAB_PUBLISH_TOKEN_FILE: /run/secrets/gitlab-publish-token
      BITBUCKET_PUBLISH_TOKEN_FILE: /run/secrets/bitbucket-publish-token
      BITBUCKET_EMAIL: ${BITBUCKET_EMAIL:-}
      REPORT_DIR: /reports
    secrets: [database-password, mcp-gateway-token, github-app-key, gitlab-publish-token, bitbucket-publish-token, openai-api-key]
    volumes: [./reports:/reports]
    entrypoint: [java, -Dorg.slf4j.simpleLogger.defaultLogLevel=off, -cp, '/app/mcp-api-gateway.jar:/app/lib/*', com.prreview.agent.AgentWorkerApplication]
    depends_on:
      postgres: {condition: service_healthy}
      mcp-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, java, -cp, '/app/mcp-api-gateway.jar:/app/lib/*', com.prreview.agent.AgentWorkerApplication, --health]
      interval: 10s
      timeout: 5s
      retries: 30

  ingress:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Public HTTPS host required}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/oci/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api-gateway: {condition: service_healthy}

secrets:
  database-password: {file: ./secrets/database-password}
  api-token: {file: ./secrets/api-token}
  mcp-gateway-token: {file: ./secrets/mcp-gateway-token}
  github-webhook-secret: {file: ./secrets/github-webhook-secret}
  gitlab-webhook-secret: {file: ./secrets/gitlab-webhook-secret}
  bitbucket-webhook-secret: {file: ./secrets/bitbucket-webhook-secret}
  github-app-key: {file: ./secrets/github-app.pem}
  gitlab-read-token: {file: ./secrets/gitlab-read-token}
  gitlab-publish-token: {file: ./secrets/gitlab-publish-token}
  bitbucket-read-token: {file: ./secrets/bitbucket-read-token}
  bitbucket-publish-token: {file: ./secrets/bitbucket-publish-token}
  openai-api-key: {file: ./secrets/openai-api-key}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
