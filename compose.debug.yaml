# Optional remote Java debugging. All debug ports stay on loopback.
services:
  api-gateway:
    environment: {JAVA_TOOL_OPTIONS: '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'}
    ports: ["127.0.0.1:5005:5005"]
  mcp-gateway:
    environment: {JAVA_TOOL_OPTIONS: '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006'}
    ports: ["127.0.0.1:5006:5006", "127.0.0.1:18080:8080"]
  agent-worker:
    environment: {JAVA_TOOL_OPTIONS: '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007'}
    ports: ["127.0.0.1:5007:5007"]
